name: lango
description: Offline vocabulary learning with Lango.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.0
  flutter_tts: ^4.2.0
  fsrs: 2.0.1
  speech_to_text: ^7.0.0
  google_mlkit_image_labeling: ^0.14.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/content/sentences.json
    - assets/brand/logo.webp.b64
