name: Lango Android CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Generate missing platform files in isolation
        run: |
          scaffold=$(mktemp -d)
          flutter create --no-pub --platforms=android,web --project-name lango --org ir.lango "$scaffold"
          for platform in android web; do
            if [ ! -d "$platform" ]; then
              cp -R "$scaffold/$platform" "$platform"
            fi
          done
          rm -rf "$scaffold"
      - run: python3 -m pip install Pillow
      - run: python3 tools/apply_brand.py
      - run: python3 tools/configure_voice.py
      - run: flutter --version
      - run: python3 -m unittest discover -s tools/tests -v
      - run: python3 tools/prepare_fonts.py
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test test --reporter expanded --timeout 60s
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: lango-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Check release signing availability
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_PASSWORD" && -n "$KEY_ALIAS" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '### Release candidate blocked: persistent Android signing secrets are missing.' >> "$GITHUB_STEP_SUMMARY"
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then exit 1; fi
          fi
      - name: Build Android release outputs
        if: steps.signing.outputs.ready == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 tools/configure_android_signing.py
          flutter build apk --release
          flutter build appbundle --release
          mkdir -p build/release-verification
          sha256sum build/app/outputs/flutter-apk/app-release.apk build/app/outputs/bundle/release/app-release.aab > build/release-verification/SHA256SUMS.txt
          apksigner_path=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$apksigner_path" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk > build/release-verification/apk-signature.txt
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab > build/release-verification/aab-signature.txt
          if grep -q 'jar is unsigned' build/release-verification/aab-signature.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          name: lango-release-candidate
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/release-verification/
          if-no-files-found: error
  offline-device:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Prepare Android test project
        run: |
          scaffold=$(mktemp -d)
          flutter create --no-pub --platforms=android --project-name lango --org ir.lango "$scaffold"
          if [ ! -d android ]; then cp -R "$scaffold/android" android; fi
          rm -rf "$scaffold"
          python3 -m pip install Pillow
          python3 tools/apply_brand.py
          python3 tools/configure_voice.py
          python3 tools/prepare_fonts.py
          flutter pub get
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual Android app with Wi-Fi and mobile data disabled
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            flutter drive --driver=test_driver/integration_test.dart --target=integration_test/offline_test.dart -d emulator-5554
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-device-evidence
          path: |
            build/device-screenshots/
            build/integration_response_data.json
          if-no-files-found: warn
