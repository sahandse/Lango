name: Prepare unsigned release for signing
on:
  workflow_dispatch:
  push:
    branches: [work/unsigned-candidate]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Prepare project and confirm unsigned configuration
        run: |
          scaffold=$(mktemp -d)
          flutter create --no-pub --platforms=android --project-name lango --org ir.lango "$scaffold"
          if [ ! -d android ]; then cp -R "$scaffold/android" android; fi
          rm -rf "$scaffold"
          python3 -m pip install Pillow
          python3 tools/apply_brand.py
          python3 tools/configure_voice.py
          python3 tools/prepare_fonts.py
          python3 -m unittest discover -s tools/tests -v
          python3 tools/configure_unsigned_android.py
          flutter pub get
      - name: Compile release APK and AAB without signing keys
        run: |
          flutter build apk --release
          flutter build appbundle --release
      - name: Verify files are unsigned and document sizes
        run: |
          mkdir -p build/unsigned-candidate
          cp build/app/outputs/flutter-apk/app-release.apk build/unsigned-candidate/Lango-UNSIGNED.apk
          cp build/app/outputs/bundle/release/app-release.aab build/unsigned-candidate/Lango-UNSIGNED.aab
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          if "$signer" verify build/unsigned-candidate/Lango-UNSIGNED.apk; then echo 'Unexpected signed APK'; exit 1; fi
          jarsigner -verify build/unsigned-candidate/Lango-UNSIGNED.aab > build/unsigned-candidate/aab-verification.txt
          grep -q 'jar is unsigned' build/unsigned-candidate/aab-verification.txt
          sha256sum build/unsigned-candidate/*.apk build/unsigned-candidate/*.aab > build/unsigned-candidate/SHA256SUMS.txt
          stat -c '%n %s bytes' build/unsigned-candidate/*.apk build/unsigned-candidate/*.aab > build/unsigned-candidate/SIZES.txt
          echo 'UNSIGNED preparation only. Not installable or publishable. Sign with the persistent Lango release key and verify both signatures before distribution.' > build/unsigned-candidate/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lango-unsigned-for-signing
          path: build/unsigned-candidate/
          if-no-files-found: error
